<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Mes Travaux</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDE0C4;--bg2:#F5EDDC;--bg3:#EAE0CC;--bg4:#E0D0B0;
  --border:rgba(61,43,26,0.1);--border-md:rgba(61,43,26,0.18);
  --text:#2A1A0A;--text-muted:#6B4A2A;--text-hint:#A08060;
  --red:#8B1A1A;--red-v:#C0392B;--red-dim:rgba(139,26,26,0.08);--red-border:rgba(139,26,26,0.22);
  --gold:#C9A84C;--gold-dim:rgba(201,168,76,0.15);--gold-border:rgba(201,168,76,0.4);
  --green:#3B7A4A;--green-dim:rgba(59,122,74,0.1);--green-border:rgba(59,122,74,0.3);
  --orange:#B05A1A;--orange-dim:rgba(176,90,26,0.1);--orange-border:rgba(176,90,26,0.25);
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text)}
body{font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* DESKTOP KANBAN */
@media(min-width:860px){
  html,body{overflow:hidden}
  .content{overflow:hidden!important;display:flex!important;flex-direction:column!important;padding-bottom:72px!important;height:100%!important}
  .filter-bar{flex-shrink:0}
  .mobile-list{display:none}
  .kanban-board{display:flex!important;gap:12px;overflow-x:scroll;overflow-y:hidden;flex:1;min-height:0;height:100%;padding-bottom:8px;align-items:stretch;scrollbar-width:thin;scrollbar-color:var(--border-md) transparent;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
  .kanban-board::-webkit-scrollbar{height:8px}
  .kanban-board::-webkit-scrollbar-track{background:var(--bg3);border-radius:4px}
  .kanban-board::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:4px}
  .kanban-col{flex:0 0 270px;min-width:270px;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-height:100%}
  .kanban-col-header{padding:10px 14px 8px;background:var(--bg4);border-bottom:1px solid var(--border);flex-shrink:0}
  .kanban-col-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
  .kanban-col-count{font-size:11px;color:var(--text-hint);margin-top:1px}
  .kanban-col-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .kanban-col-body::-webkit-scrollbar{width:4px}
  .kanban-col-body::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px}
  .done-row{display:none}
  .addbar{max-width:none}
  .drop-insert-line{height:3px;background:var(--red);border-radius:2px;margin:2px 0;display:none}
  .drop-insert-line.show{display:block}
}
@media(max-width:859px){
  .kanban-board{display:none}
}

/* HEADER */
.header{padding:1.1rem 1.25rem 0.75rem;flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border-md)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem}
.header-title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;letter-spacing:-0.5px;color:var(--text)}
.header-title em{color:var(--red);font-style:normal}
.header-badge{background:var(--red-dim);border:1px solid var(--red-border);border-radius:10px;padding:5px 12px;text-align:center}
.badge-num{font-size:20px;font-weight:900;font-family:'Montserrat',sans-serif;color:var(--red);line-height:1;letter-spacing:-0.5px}
.badge-lbl{font-size:9px;color:var(--red);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px;opacity:0.6}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:9px 4px;text-align:center}
.stat-num{font-size:18px;font-weight:800;font-family:'Montserrat',sans-serif;letter-spacing:-0.5px;line-height:1;color:var(--text)}
.stat-lbl{font-size:9px;color:var(--text-hint);margin-top:2px;letter-spacing:0.5px;text-transform:uppercase}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.nbtn{flex:1;padding:10px 4px;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;text-align:center;border:none;border-bottom:2px solid transparent;cursor:pointer;background:transparent;color:var(--text-muted);transition:all 0.15s}
.nbtn.active{color:var(--red);border-bottom-color:var(--red);font-weight:700}

/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1.25rem;min-height:0;padding-bottom:80px}

/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--bg3);border-radius:var(--rs);padding:3px;gap:2px;flex-shrink:0;border:1px solid var(--border)}
.seg-btn{font-size:11px;padding:5px 12px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;white-space:nowrap}
.seg-btn.active{background:var(--bg2);color:var(--red);font-weight:700;box-shadow:0 1px 3px rgba(61,43,26,0.1)}
.chips{display:flex;gap:6px}
.chip{font-size:11px;padding:5px 12px;border-radius:20px;background:var(--bg2);color:var(--text-muted);cursor:pointer;border:1px solid var(--border);white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.chip.on{color:var(--red);border-color:var(--red-border);background:var(--red-dim);font-weight:700}
.chip.prio-on{border-color:var(--chip-c);color:var(--chip-c);background:transparent}

/* SECTION LABEL */
.section-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin:1rem 0 0.5rem}
.section-lbl:first-child{margin-top:0}

/* TASK CARD */
.task-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:border-color 0.15s}
.task-card:hover{border-color:var(--border-md)}
.task-card:active{transform:scale(0.99)}
.task-card.done-card{opacity:.55}
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-md);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--bg)}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-check.done::after{content:'✓';font-size:11px;color:#fff;font-weight:700}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
.task-title.done{text-decoration:line-through;color:var(--text-hint)}
.task-meta{display:flex;gap:8px;margin-top:4px;align-items:center;flex-wrap:wrap}
.task-piece{font-size:11px;color:var(--text-muted);font-weight:500}
.task-note{font-size:11px;color:var(--text-hint);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.prio-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:0.3px}
.prio-urgente .prio-pill{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.prio-importante .prio-pill{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border)}
.prio-normale .prio-pill{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.prio-basse .prio-pill{background:rgba(0,0,0,0.04);color:var(--text-hint);border:1px solid var(--border)}

.done-row{text-align:center;padding:8px 0 2px}
.done-toggle{font-size:11px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:4px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;border-radius:20px;border:1px solid var(--border)}
.done-toggle:hover{color:var(--red)}

.empty{text-align:center;padding:3rem 1rem;color:var(--text-hint);font-size:14px}

/* PIÈCES SCREEN */
.piece-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.piece-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.piece-count{font-size:11px;color:var(--text-muted);font-weight:500}
.piece-del{background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:18px;padding:0 4px;line-height:1;font-family:inherit}
.piece-del:hover{color:var(--red)}
.piece-row{cursor:grab}
.piece-row.piece-dz-over{background:var(--red-dim);border-color:var(--red-border);border-radius:var(--rs)}
.pieces-list{display:flex;flex-direction:column}
.piece-insert-line{height:3px;background:var(--red);border-radius:2px;margin:1px 0;opacity:0;transition:opacity .1s;pointer-events:none}
.piece-insert-line.show{opacity:1}
.add-piece-row{display:flex;gap:8px;margin-top:16px}
.add-piece-input{flex:1;background:var(--bg2);border:1.5px solid var(--border-md);border-radius:var(--rs);padding:10px 13px;font-size:14px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.add-piece-input:focus{border-color:var(--red-border)}
.btn-add-piece{background:var(--red);border:none;border-radius:var(--rs);padding:10px 18px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.btn-add-piece:hover{background:var(--red-v)}

/* ADD BAR */
.addbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border-md);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10;max-width:600px;margin:0 auto}
.addbar input{flex:1;background:var(--bg);border:1.5px solid var(--border-md);border-radius:var(--rs);padding:10px 14px;font-size:14px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.addbar input:focus{border-color:var(--red-border)}
.addbar input::placeholder{color:var(--text-hint)}
.add-btn{width:40px;height:40px;border-radius:50%;background:var(--red);border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:700;line-height:1}
.add-btn:hover{background:var(--red-v)}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(42,26,10,0.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:16px 20px 40px;max-height:92vh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:var(--border-md);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;letter-spacing:-0.3px;margin-bottom:16px;color:var(--text)}
.field{margin-bottom:16px}
.field label{font-size:10px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px}
.field input,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--border-md);border-radius:var(--rs);padding:11px 13px;font-size:14px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field textarea:focus{border-color:var(--red-border)}
.prio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prio-opt{padding:10px 4px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;font-size:11px;font-weight:600;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;transition:all .1s}
.prio-opt.sel-urgente{background:var(--red-dim);border-color:var(--red-border);color:var(--red)}
.prio-opt.sel-importante{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange)}
.prio-opt.sel-normale{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold)}
.prio-opt.sel-basse{background:rgba(0,0,0,0.04);border-color:var(--border-md);color:var(--text-hint)}
.piece-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.piece-opt{padding:9px 4px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;font-size:11px;font-weight:500;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;word-break:break-word;transition:all .1s}
.piece-opt.sel{border-color:var(--red-border);color:var(--red);background:var(--red-dim);font-weight:700}
.sheet-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.sheet-footer-right{display:flex;gap:8px}
.btn{font-size:13px;padding:9px 18px;border-radius:var(--rs);border:1px solid var(--border-md);background:var(--bg);color:var(--text-muted);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.btn:hover{color:var(--text)}
.btn-save{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn-save:hover{background:var(--red-v)}
.btn-del{color:var(--red);border-color:transparent;background:transparent;font-weight:600}

.voice-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.voice-btn{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 11px;border-radius:6px;border:1px solid var(--border-md);background:var(--bg);color:var(--text-muted);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.voice-btn.on{border-color:var(--red-border);color:var(--red);animation:pulse 1s infinite}
.mic{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* DRAG & DROP */
.drag-handle{color:var(--text-hint);font-size:14px;cursor:grab;flex-shrink:0;padding:0 2px;user-select:none;line-height:1;margin-top:3px}
.drag-handle:active{cursor:grabbing}
.drop-zone{min-height:52px;border-radius:var(--r);transition:background .15s,border .15s;border:2px dashed transparent;padding:2px}
.drop-zone.dz-over{background:var(--red-dim);border-color:var(--red-border)}
.dz-empty{text-align:center;padding:14px;font-size:12px;color:var(--text-hint);font-style:italic}
</style>
</head>

function onDragStart(e,id,group){

function onDragEnd(e){

}
function onDragOverCard(e,id){
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect='move';
  // show insert line above this card
  document.querySelectorAll('.drop-insert-line').forEach(l=>l.classList.remove('show'));
  const line=document.querySelector(`.drop-insert-line[data-before="${id}"]`);
  if(line)line.classList.add('show');
  dragOverId=id;
}
function onDragOverZone(e,groupVal){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  dragGroup=groupVal;
}
async function onDropCard(e,beforeId,groupVal){
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.drop-insert-line').forEach(l=>l.classList.remove('show'));
  if(dragId===null)return;
  await reorderTask(dragId, beforeId, groupVal);
  dragId=null; dragOverId=null;
}
async function onDrop(e,groupVal){
  e.preventDefault();
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('dz-over'));
  document.querySelectorAll('.drop-insert-line').forEach(l=>l.classList.remove('show'));
  if(dragId===null)return;
  // dropped on empty zone or zone bottom → move to end of group
  await reorderTask(dragId, null, groupVal);
  dragId=null;
}

async function reorderTask(id, beforeId, groupVal){
  // 1. Update group (piece or prio) if changed
  let task=tasks.find(t=>t.id===id);
  if(!task)return;
  const groupChanged = groupVal && (filterMode==="piece" ? task.piece!==groupVal : task.priorite!==groupVal);

  // 2. Get items in target group (after potential group change)
  const getGroup=(t)=>filterMode==="piece"?t.piece:t.priorite;
  let groupItems=tasks
    .filter(t=>t.id!==id && t.statut!=="done" && getGroup(t)===(groupChanged?groupVal:getGroup(task)))
    .sort((a,b)=>(a.order||0)-(b.order||0));

  // 3. Insert at position
  const insertIdx = beforeId ? groupItems.findIndex(t=>t.id===beforeId) : groupItems.length;
  const idx = insertIdx<0 ? groupItems.length : insertIdx;
  groupItems.splice(idx,0,{...task});

  // 4. Reassign order values
  const updates=[];
  groupItems.forEach((t,i)=>{
    const newOrder=(i+1)*1000;
    const isMovedTask=(t.id===id);
    const newPiece=isMovedTask&&filterMode==="piece"&&groupChanged?groupVal:t.piece;
    const newPrio=isMovedTask&&filterMode==="prio"&&groupChanged?groupVal:t.priorite;
    tasks=tasks.map(x=>x.id===t.id?{...x,order:newOrder,piece:newPiece,priorite:newPrio}:x);
    updates.push(tasks.find(x=>x.id===t.id));
  });
  render();
  for(const u of updates) await upsertTask(u);
}

// Touch drag support — long press (400ms) pour démarrer, scroll normal sinon
let touchDragId=null,touchClone=null,touchTargetGroup=null,touchBeforeId=null;
let _touchTimer=null,_touchStartY=0,_touchStartX=0,_touchDragging=false;

function onTouchStart(e,id,group){
  if(e.touches.length>1)return;
  const t=e.touches[0];
  _touchStartX=t.clientX; _touchStartY=t.clientY;
  _touchDragging=false;
  _touchTimer=setTimeout(()=>{
    // Long press — start drag
    _touchDragging=true;
    touchDragId=id;
    const card=e.currentTarget;
    const rect=card.getBoundingClientRect();
    touchClone=card.cloneNode(true);
    touchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.85;pointer-events:none;z-index:999;border-radius:12px;box-shadow:0 8px 24px rgba(61,43,26,0.25)`;
    document.body.appendChild(touchClone);
    card.style.opacity='0.3';
    touchTargetGroup=group;
    // Vibration feedback
    if(navigator.vibrate) navigator.vibrate(40);
  },400);
}
function onTouchMove(e){
  if(!_touchDragging){
    // Not dragging yet — cancel timer if moved too much
    const t=e.touches[0];
    const dx=Math.abs(t.clientX-_touchStartX), dy=Math.abs(t.clientY-_touchStartY);
    if(dx>8||dy>8){clearTimeout(_touchTimer);_touchTimer=null;}
    return; // let scroll happen normally
  }
  if(!touchClone)return;
  e.preventDefault();
  const t=e.touches[0];
  touchClone.style.left=(t.clientX-touchClone.offsetWidth/2)+'px';
  touchClone.style.top=(t.clientY-30)+'px';
  touchClone.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  touchClone.style.display='';
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('dz-over'));
  document.querySelectorAll('.drop-insert-line').forEach(l=>l.classList.remove('show'));
  const zone=el?.closest('.drop-zone');
  const card=el?.closest('.task-card');
  if(zone){zone.classList.add('dz-over');touchTargetGroup=zone.dataset.group;}
  if(card){
    const bid=parseInt(card.dataset.taskId);
    touchBeforeId=bid;
    const line=document.querySelector(`.drop-insert-line[data-before="${bid}"]`);
    if(line)line.classList.add('show');
  } else {touchBeforeId=null;}
}
async function onTouchEnd(e){
  clearTimeout(_touchTimer); _touchTimer=null;
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('dz-over'));
  document.querySelectorAll('.drop-insert-line').forEach(l=>l.classList.remove('show'));
  document.querySelectorAll('.task-card').forEach(c=>c.style.opacity='');
  if(_touchDragging&&touchDragId!==null&&touchTargetGroup!==null){
    await reorderTask(touchDragId, touchBeforeId, touchTargetGroup);
  }
  _touchDragging=false;
  touchDragId=null; touchTargetGroup=null; touchBeforeId=null;
}

        <button class="seg-btn${filterMode==="prio"?" active":""}" onclick="filterMode='prio';filterVal=null;render()">Priorité</button>
      </div>
      <div class="chips">${chips.join("")}</div>
    </div>
    ${kanbanHtml(todoList)}
    <div class="mobile-list">
      ${todoList.length===0?`<div class="empty">Tout est fait 🎉</div>`:mobileGroupHtml(todoList)}
      ${showDone&&doneList.length>0?`<div class="section-lbl" style="margin-top:1rem;opacity:.6">Terminés — ${doneList.length}</div><div style="opacity:.55">${doneList.map(t=>taskHtml(t,false)).join("")}</div>`:""}
      ${doneList.length>0?`<div class="done-row"><button class="done-toggle" onclick="showDone=!showDone;render()">${showDone?"Masquer les terminés":"Voir les terminés ("+doneList.length+")"}</button></div>`:""}
    </div>
    <div class="addbar">
      <input id="quick-input" placeholder="Ajouter un travail..." onkeydown="if(event.key==='Enter'&&this.value.trim()){quickAdd(this.value);this.value=''}">
      <button class="add-btn" onclick="const i=document.getElementById('quick-input');if(i.value.trim()){quickAdd(i.value);i.value=''}else{openAdd()}">+</button>
    </div>`;
}

let dragPiece=null,dragOverPiece=null,dragBeforePiece=null;
let _pTouchTimer=null,_pTouchDragging=false,_pTouchStartY=0,_pTouchClone=null,_pTouchName=null;

function onPieceDragStart(e,name){
  dragPiece=name;
  _isDraggingPiece=true;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.querySelector(`.piece-row[data-piece="${CSS.escape(name)}"]`);if(el)el.style.opacity='0.35';},0);
}
function onPieceDragEnd(e){
  document.querySelectorAll('.piece-row').forEach(r=>{r.style.opacity='';r.classList.remove('piece-dz-over');});
  document.querySelectorAll('.piece-insert-line').forEach(l=>l.classList.remove('show'));
  dragPiece=null; dragOverPiece=null; dragBeforePiece=null;
  setTimeout(()=>{_isDraggingPiece=false;},500);
}
function onPieceDragOver(e,name){
  e.preventDefault();
  if(name===dragPiece)return;
  document.querySelectorAll('.piece-row').forEach(r=>r.classList.remove('piece-dz-over'));
  document.querySelectorAll('.piece-insert-line').forEach(l=>l.classList.remove('show'));
  // show insert line before this piece
  const line=document.querySelector(`.piece-insert-line[data-before="${CSS.escape(name)}"]`);
  if(line)line.classList.add('show');
  dragBeforePiece=name;
}
async function onPieceDropZone(e){
  e.preventDefault();
  document.querySelectorAll('.piece-row').forEach(r=>{r.style.opacity='';r.classList.remove('piece-dz-over');});
  document.querySelectorAll('.piece-insert-line').forEach(l=>l.classList.remove('show'));
  if(!dragPiece)return;
  await reorderPiece(dragPiece, dragBeforePiece);
  dragPiece=null; dragBeforePiece=null;
  setTimeout(()=>{_isDraggingPiece=false;},500);
}

async function reorderPiece(name, beforeName){
  const from=pieces.indexOf(name);
  if(from<0)return;
  pieces.splice(from,1);
  const to=beforeName&&beforeName!=='__end__'?pieces.indexOf(beforeName):pieces.length;
  pieces.splice(to<0?pieces.length:to,0,name);
  render();
  // Save each piece's sort_order with explicit PATCH
  for(let i=0;i<pieces.length;i++){
    await fetch(`${SUPA_URL}/rest/v1/travaux_pieces?name=eq.${encodeURIComponent(pieces[i])}`,{
      method:'PATCH',
      headers:H,
      body:JSON.stringify({sort_order:i})
    });
  }
}

// Touch for pieces — long press
function onPieceTouchStart(e,name){
  _pTouchStartY=e.touches[0].clientY; _pTouchDragging=false; _pTouchName=name;
  _pTouchTimer=setTimeout(()=>{
    _pTouchDragging=true;
    _isDraggingPiece=true;
    const row=e.currentTarget;
    const rect=row.getBoundingClientRect();
    _pTouchClone=row.cloneNode(true);
    _pTouchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.85;pointer-events:none;z-index:999;background:var(--bg2);border-radius:8px;box-shadow:0 6px 20px rgba(61,43,26,0.2)`;
    document.body.appendChild(_pTouchClone);
    row.style.opacity='0.3';
    if(navigator.vibrate)navigator.vibrate(40);
  },400);
}
function onPieceTouchMove(e){
  if(!_pTouchDragging){
    if(Math.abs(e.touches[0].clientY-_pTouchStartY)>8){clearTimeout(_pTouchTimer);_pTouchTimer=null;}
    return;
  }
  e.preventDefault();
  const t=e.touches[0];
  _pTouchClone.style.top=(t.clientY-24)+'px';
  _pTouchClone.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  _pTouchClone.style.display='';
  document.querySelectorAll('.piece-insert-line').forEach(l=>l.classList.remove('show'));
  const row=el?.closest('.piece-row');
  if(row&&row.dataset.piece&&row.dataset.piece!==_pTouchName){
    dragBeforePiece=row.dataset.piece;
    const line=document.querySelector(`.piece-insert-line[data-before="${CSS.escape(dragBeforePiece)}"]`);
    if(line)line.classList.add('show');
  } else if(!row){
    dragBeforePiece=null; // drop at end
  }
}
async function onPieceTouchEnd(e){
  clearTimeout(_pTouchTimer);_pTouchTimer=null;
  if(_pTouchClone){_pTouchClone.remove();_pTouchClone=null;}
  document.querySelectorAll('.piece-row').forEach(r=>{r.style.opacity='';r.classList.remove('piece-dz-over');});
  document.querySelectorAll('.piece-insert-line').forEach(l=>l.classList.remove('show'));
  if(_pTouchDragging&&_pTouchName){
    await reorderPiece(_pTouchName, dragBeforePiece);
  }
  _pTouchDragging=false; _pTouchName=null; dragBeforePiece=null;
  setTimeout(()=>{_isDraggingPiece=false;},500);
}

function renderPieces(){
  document.getElementById("content-root").innerHTML=`
    <div class="section-lbl">${pieces.length} pièce(s) — <span style="font-weight:400;text-transform:none;letter-spacing:0">glisser pour réordonner</span></div>
    <div class="pieces-list"
      ondragover="event.preventDefault()"
      ondrop="onPieceDropZone(event)">
      ${pieces.map(p=>{
        const count=tasks.filter(t=>t.piece===p).length;
        const esc=p.replace(/'/g,"\\'");
        const escData=p.replace(/"/g,'&quot;');
        return`
          <div class="piece-insert-line" data-before="${escData}"></div>
          <div class="piece-row" data-piece="${escData}"
            draggable="true"
            ondragstart="onPieceDragStart(event,'${esc}')"
            ondragend="onPieceDragEnd(event)"
            ondragover="onPieceDragOver(event,'${esc}')"
            ontouchstart="onPieceTouchStart(event,'${esc}')"
            ontouchmove="onPieceTouchMove(event)"
            ontouchend="onPieceTouchEnd(event)">
            <span class="drag-handle" style="margin-right:4px">⠿</span>
            <span class="piece-name">${p}</span>
            <span class="piece-count">${count} tâche${count>1?"s":""}</span>
            <button class="piece-del" onclick="deletePiece('${esc}')" title="Supprimer">×</button>
          </div>`;
      }).join("")}
      <div class="piece-insert-line" data-before="__end__"></div>
    </div>
    <div class="add-piece-row">
      <input class="add-piece-input" id="new-piece-input" placeholder="Nom de la nouvelle pièce..." onkeydown="if(event.key==='Enter')addPiece()">
      <button class="btn-add-piece" onclick="addPiece()">Ajouter</button>
    </div>`;
}

function render(){
  renderHeader();
  renderNav();
  if(currentTab==="tasks")renderTasks();
  else renderPieces();
}

loadAll();
</script>
</body>
</html>
