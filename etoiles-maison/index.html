<style>
  :root {
    --bg: #FFF8EE;
    --bg-elev: #FFFFFF;
    --bg-soft: #F4ECE0;
    --ink: #1A1410;
    --ink-soft: #6B5D4F;
    --ink-mute: #A09080;
    --border: #E8DDC8;
    --border-strong: #1A1410;
    --accent: #D4502A;
    --accent-soft: #F8DDD0;
    --gold: #C99B3D;
    --gold-soft: #FAEBC0;
    --green: #4A7C2A;
    --green-soft: #DDEAC4;
    --leo: #2563B5;
    --leo-soft: #D4E4F4;
    --chloe: #C13D7E;
    --chloe-soft: #F8D5E5;
    --family: #6B4FB5;
    --family-soft: #E0D6F2;
    --shadow-sm: 2px 2px 0 var(--ink);
    --shadow-md: 3px 3px 0 var(--ink);
    --shadow-lg: 5px 5px 0 var(--ink);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  body {
    background-image:
      radial-gradient(circle at 10% 20%, rgba(212, 80, 42, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(201, 155, 61, 0.05) 0%, transparent 50%);
    min-height: 100vh;
  }

  .display { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.02em; }

  /* === LAYOUT === */
  .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 6rem; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .logo { display: flex; align-items: baseline; gap: 8px; }
  .logo-mark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px; letter-spacing: -0.03em; line-height: 1; }
  .logo-mark .star { color: var(--accent); display: inline-block; transform: rotate(-8deg); }
  .logo-sub { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.15em; }

  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-mute);
    padding: 4px 10px; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .sync-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* === KID SELECTOR === */
  .kids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kid {
    background: var(--bg-elev);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
  }
  .kid:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .kid.active { background: var(--accent); color: var(--bg-elev); }
  .kid.active .kid-points { color: var(--bg-elev); opacity: 0.9; }
  .kid-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px;
    border: 2px solid var(--ink);
    flex-shrink: 0;
  }
  .kid[data-color="leo"].active .kid-avatar { background: var(--leo); color: var(--bg-elev); }
  .kid[data-color="chloe"].active .kid-avatar { background: var(--chloe); color: var(--bg-elev); }
  .kid[data-color="leo"] .kid-avatar { background: var(--leo-soft); color: var(--leo); }
  .kid[data-color="chloe"] .kid-avatar { background: var(--chloe-soft); color: var(--chloe); }
  .kid-info { min-width: 0; flex: 1; }
  .kid-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; line-height: 1.1; margin-bottom: 2px; }
  .kid-age { font-size: 11px; opacity: 0.7; }
  .kid-points { font-size: 13px; color: var(--ink-soft); margin-top: 2px; font-weight: 500; }

  /* === FAMILY BAR === */
  .family-bar {
    background: var(--family-soft);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .family-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 12px,
      rgba(107, 79, 181, 0.05) 12px,
      rgba(107, 79, 181, 0.05) 13px
    );
    pointer-events: none;
  }
  .family-bar-left { display: flex; align-items: center; gap: 12px; position: relative; }
  .family-icon {
    width: 38px; height: 38px;
    background: var(--bg-elev);
    border: 2px solid var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--family);
  }
  .family-icon svg { width: 22px; height: 22px; }
  .family-meta { font-family: 'Fraunces', serif; font-weight: 500; font-size: 13px; color: var(--ink-soft); line-height: 1.2; text-transform: uppercase; letter-spacing: 0.1em; }
  .family-points { font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px; color: var(--family); line-height: 1; }
  .family-bar-right { font-size: 11px; color: var(--ink-soft); text-align: right; line-height: 1.3; position: relative; }

  /* === STATS === */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat {
    background: var(--bg-elev);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    box-shadow: var(--shadow-sm);
  }
  .stat-label { font-size: 10px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .stat-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; line-height: 1; }
  .stat-sub { font-size: 10px; color: var(--ink-soft); margin-top: 4px; }
  .stat-bar { height: 4px; background: var(--bg-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .stat-bar-fill { height: 100%; background: var(--green); transition: width 0.4s; }

  /* === TABS === */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 1.25rem;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 12px;
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: max-content;
    padding: 8px 12px;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab.active { background: var(--ink); color: var(--bg); }

  /* === BANNERS === */
  .banner {
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.5;
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .banner-info { background: var(--gold-soft); }
  .banner-success { background: var(--green-soft); text-align: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
  .banner-family { background: var(--family-soft); }

  /* === TASK CARDS === */
  .task-list, .reward-list { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--bg-elev);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
  }
  .card.done { background: var(--bg-soft); opacity: 0.65; }
  .card.done .card-name { text-decoration: line-through; }

  .card-icon {
    width: 42px; height: 42px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg { width: 22px; height: 22px; }

  .icon-blue { background: #DCEAF8; color: #1A4A85; }
  .icon-pink { background: #F8DDE7; color: #8B2A56; }
  .icon-green { background: #DDEAC4; color: #2A5418; }
  .icon-amber { background: #F8E5BD; color: #6B4A0A; }
  .icon-coral { background: #F8D8C8; color: #8C3B1A; }
  .icon-purple { background: #E2D8F2; color: #4A348A; }
  .icon-teal { background: #C8E8DD; color: #1A5544; }
  .icon-gray { background: #E8E0D2; color: #4A4030; }

  .card-content { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 14px; color: var(--ink); margin: 0 0 2px; line-height: 1.3; }
  .card-meta { font-size: 11px; color: var(--ink-soft); margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .chip { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .chip-house { background: #DCEAF8; color: #1A4A85; }
  .chip-pet { background: #F8D8C8; color: #8C3B1A; }
  .chip-garden { background: #DDEAC4; color: #2A5418; }
  .chip-school { background: #E2D8F2; color: #4A348A; }
  .chip-hygiene { background: #F8DDE7; color: #8B2A56; }
  .chip-bonus { background: #F8E5BD; color: #6B4A0A; }
  .chip-shared { background: var(--bg-soft); color: var(--ink-soft); border: 1px solid var(--border); }
  .chip-perso { background: var(--bg-soft); color: var(--ink-soft); border: 1px solid var(--border); }

  .done-by { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .done-leo { background: var(--leo-soft); color: var(--leo); }
  .done-chloe { background: var(--chloe-soft); color: var(--chloe); }

  .points-pill {
    background: var(--gold-soft);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 4px 10px;
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-size: 13px; font-weight: 700;
    white-space: nowrap;
  }

  /* === BUTTONS === */
  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    background: var(--bg-elev);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    transition: all 0.1s;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { transform: translate(1px, 1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-success { background: var(--green); color: var(--bg-elev); }
  .btn-accent { background: var(--accent); color: var(--bg-elev); }
  .btn-danger { background: transparent; color: var(--accent); border-color: var(--accent); }
  .btn-icon { padding: 6px 10px; }

  /* === LEADERBOARD === */
  .leaderboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .lb-item {
    background: var(--bg-elev);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .lb-item.lb-leo { background: var(--leo-soft); }
  .lb-item.lb-chloe { background: var(--chloe-soft); }
  .lb-item.lb-family { background: var(--family-soft); }
  .lb-name { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .lb-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; line-height: 1; }
  .lb-sub { font-size: 10px; color: var(--ink-mute); margin-top: 4px; }

  /* === WEEK GRID === */
  .week-grid {
    background: var(--bg-elev);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
  }
  .week-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .week-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; }
  .week-total { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .day {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1.5px solid var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    padding: 4px 2px;
  }
  .day.today { background: var(--ink); color: var(--bg); }
  .day.done { background: var(--green-soft); }
  .day.partial { background: var(--gold-soft); }
  .day.weekend { background: var(--bg-soft); border-style: dashed; }
  .day-letter { font-family: 'Fraunces', serif; font-weight: 600; font-size: 12px; line-height: 1; }
  .day-points { font-size: 9px; margin-top: 2px; line-height: 1; opacity: 0.85; font-weight: 500; }

  /* === PARENT === */
  .parent-lock {
    background: var(--bg-elev);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .parent-lock h3 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 6px; }
  .parent-lock p { color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; }
  .pin-input {
    padding: 12px 16px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px;
    background: var(--bg);
    width: 180px; text-align: center;
    letter-spacing: 0.5em;
    color: var(--ink);
    margin-bottom: 12px;
    display: block;
    margin-left: auto; margin-right: auto;
  }
  .pin-input:focus { outline: none; box-shadow: 3px 3px 0 var(--ink); }

  .panel {
    background: var(--bg-elev);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .panel h4 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; margin: 0 0 10px; }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .row-label { flex: 1; font-size: 13px; min-width: 80px; font-weight: 500; }
  .row-label strong { font-family: 'Fraunces', serif; }

  .form-input, .form-select {
    padding: 8px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--bg);
    color: var(--ink);
  }
  .form-input:focus, .form-select:focus { outline: none; box-shadow: 2px 2px 0 var(--ink); }

  /* === REWARD VIEW SWITCH === */
  .reward-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 12px;
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
  }
  .reward-switch button {
    padding: 10px;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 8px;
  }
  .reward-switch button.active { background: var(--ink); color: var(--bg); }

  /* === HISTORY === */
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-name { font-size: 14px; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .history-meta { font-size: 11px; color: var(--ink-mute); }
  .history-points { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .history-points.plus { color: var(--green); }
  .history-points.minus { color: var(--accent); }

  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-mute);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .category-section { margin-bottom: 1.25rem; }
  .category-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--ink);
  }

  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin: 1rem 0 0.75rem;
  }
  .section-head h4 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; margin: 0; }

  .add-form {
    background: var(--bg-soft);
    border: 1.5px dashed var(--ink);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 12px;
    display: none;
  }
  .add-form.open { display: block; }
  .add-form input, .add-form select { width: 100%; margin-bottom: 8px; }
  .add-form .row-cols { display: flex; gap: 8px; }
  .add-form .row-cols > * { flex: 1; }
  .add-form .row-cols input[type="number"] { flex: 0 0 70px; }

  .loader {
    text-align: center;
    padding: 4rem 2rem;

  }

  .setup {
    max-width: 480px;

    padding: 1.5rem;
  }

  .setup .lead { color: var(--ink-soft); margin-bottom: 1.5rem; line-height: 1.5; }
  .setup-card {
    background: var(--bg-elev);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 1.25rem;
    box-shadow: var(--shadow-md);
    margin-bottom: 1rem;
  }
  .setup-card label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  .setup-card input { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--bg); font-family: inherit; }
  .setup-card .hint { font-size: 12px; color: var(--ink-mute); margin-top: 6px; }
  .setup-card .btn { padding: 12px 20px; font-size: 14px; margin-top: 12px; width: 100%; }

  /* === RESPONSIVE === */

  /* Desktop large : 2 colonnes pour les tâches & récompenses */
  @media (min-width: 900px) {
    .app { padding: 2rem 2rem 6rem; }
    .logo-mark { font-size: 36px; }
    .top-section { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
    .top-section .kids { margin-bottom: 0; }
    .top-section .family-bar { margin-bottom: 0; }
    .task-list, .reward-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .stat { padding: 16px 18px; }
    .stat-value { font-size: 28px; }
    .leaderboard { gap: 14px; }
    .lb-value { font-size: 30px; }
    .family-points { font-size: 34px; }
    .kid { padding: 18px 20px; }
    .kid-avatar { width: 52px; height: 52px; font-size: 24px; }
    .kid-name { font-size: 19px; }
    .week-grid { padding: 18px; }
    .day-letter { font-size: 14px; }
    .day-points { font-size: 11px; }
    /* Banners et leaderboard restent pleine largeur */
    .banner { font-size: 14px; padding: 14px 18px; }
  }

  /* Très grand écran : 3 colonnes pour les tâches */
  @media (min-width: 1300px) {
    .app { max-width: 1280px; }
    .task-list, .reward-list {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .app { padding: 0.75rem 0.75rem 5rem; }
    .stats { grid-template-columns: 1fr 1fr; }

    .logo-mark { font-size: 24px; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

// === STATE & SYNC ===
let state = null;
let saveTimeout = null;
let pollTimer = null;
const LS_KEY = 'etoiles-maison-' + CONFIG.FAMILY_KEY;
const LS_BIN = 'etoiles-maison-bin-' + CONFIG.FAMILY_KEY;

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function todayKey() { return new Date().toISOString().slice(0, 10); }
function weekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(date) { return weekStart(date).toISOString().slice(0, 10); }

function setSync(status, msg) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (!dot) return;
  dot.classList.remove('loading', 'error');
  if (status === 'loading') dot.classList.add('loading');
  else if (status === 'error') dot.classList.add('error');
  if (txt) txt.textContent = msg;
}

// === CLOUD SYNC via jsonbin.io (gratuit, pas de compte) ===
// Documentation : https://jsonbin.io/api-reference
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

async function createBin(data) {
  try {
    const res = await fetch(JSONBIN_BASE, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Bin-Private': 'false',
        'X-Bin-Name': CONFIG.FAMILY_KEY,
      },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error('create bin failed');
    const json = await res.json();
    return json.metadata.id;
  } catch(e) {
    console.warn('Cloud sync indisponible, mode local seulement', e);
    return null;
  }
}

async function readBin(binId) {
  try {
    const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`);
    if (!res.ok) throw new Error('read failed');
    const json = await res.json();
    return json.record;
  } catch(e) {
    return null;
  }
}

async function updateBin(binId, data) {
  try {
    const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return res.ok;
  } catch(e) {
    return false;
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

function getBinId() {
  return localStorage.getItem(LS_BIN);
}
function setBinId(id) {
  localStorage.setItem(LS_BIN, id);
}

function migrateState(s) {
  // Ajoute les champs manquants pour la rétrocompatibilité
  if (!s.penalties) s.penalties = clone(DEFAULT_STATE.penalties);
  if (!s.completedShared) s.completedShared = {};
  if (!s.completedPerso) s.completedPerso = { 'leo': {}, 'chloe': {} };
  if (!s.weeklyLog) s.weeklyLog = { 'leo': {}, 'chloe': {}, 'family': {} };
  if (!s.weeklyLog.family) s.weeklyLog.family = {};
  if (!s.history) s.history = [];
  if (s.familyPoints === undefined) s.familyPoints = 0;
  if (s.familyTotalEarned === undefined) s.familyTotalEarned = 0;
  if (!s.rewardView) s.rewardView = 'perso';
  return s;
}

async function loadState() {
  setSync('loading', 'Chargement…');
  const local = loadLocal();
  let binId = getBinId();

  // URL avec un binId partagé prend le dessus
  const urlBin = new URLSearchParams(location.search).get('bin');
  if (urlBin) {
    binId = urlBin;
    setBinId(urlBin);
  }

  if (binId && CONFIG.USE_CLOUD) {
    const remote = await readBin(binId);
    if (remote && remote.lastSaved) {
      // Compare avec local
      if (!local || (remote.lastSaved || 0) >= (local.lastSaved || 0)) {
        state = migrateState(remote);
        saveLocal();
        setSync('ok', 'Synchronisé');
        return;
      }
    }
  }

  if (local) {
    state = migrateState(local);
    if (binId && CONFIG.USE_CLOUD) {
      // Push local vers cloud
      await updateBin(binId, state);
    }
    setSync('ok', binId ? 'Synchronisé' : 'Local');
  } else {
    state = clone(DEFAULT_STATE);
    state.lastSaved = Date.now();
    saveLocal();
    if (CONFIG.USE_CLOUD) {
      const newBinId = await createBin(state);
      if (newBinId) {
        setBinId(newBinId);
        state.binId = newBinId;
        saveLocal();
        setSync('ok', 'Synchronisé');
      } else {
        setSync('error', 'Mode local');
      }
    } else {
      setSync('ok', 'Local');
    }
  }
}

async function saveState() {
  if (!state) return;
  state.lastSaved = Date.now();
  saveLocal();
  setSync('loading', 'Sauvegarde…');
  const binId = getBinId();
  if (binId && CONFIG.USE_CLOUD) {
    const ok = await updateBin(binId, state);
    setSync(ok ? 'ok' : 'error', ok ? 'Synchronisé' : 'Erreur');
  } else {
    setSync('ok', 'Local');
  }
}

function debouncedSave() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveState, 600);
}

async function pollUpdates() {
  if (!state) return;
  const binId = getBinId();
  if (!binId || !CONFIG.USE_CLOUD) return;
  try {
    const remote = await readBin(binId);
    if (remote && (remote.lastSaved || 0) > (state.lastSaved || 0)) {
      const tab = state.activeTab;
      const kid = state.activeKidId;
      const unlocked = state.parentUnlocked;
      const rview = state.rewardView;
      state = migrateState(remote);
      state.activeTab = tab;
      state.activeKidId = kid;
      state.parentUnlocked = unlocked;
      state.rewardView = rview;
      saveLocal();
      render();
      setSync('ok', 'Mis à jour');
    }
  } catch(e) {}
}

// === HELPERS ===
function activeKid() { return state.kids.find(k => k.id === state.activeKidId); }
function otherKid() { return state.kids.find(k => k.id !== state.activeKidId); }

function activeTodayTasks() {
  const day = new Date().getDay();
  const isWeekday = day >= 1 && day <= 5;
  return state.tasks.filter(t => {
    if (t.frequency === 'daily') return true;
    if (t.frequency === 'weekday') return isWeekday;
    if (t.frequency === 'weekly') return day === 6;
    if (t.frequency === 'asneeded') return true;
    return true;
  });
}

function freqLabel(f) {
  return f === 'daily' ? 'Tous les jours'
    : f === 'weekday' ? 'En semaine'
    : f === 'weekly' ? '1× / semaine'
    : f === 'asneeded' ? 'Au besoin'
    : f;
}

function thisWeekPoints(scope) {
  const ws = weekStart(new Date());
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws);
    d.setDate(d.getDate() + i);
    const k = d.toISOString().slice(0, 10);
    total += (state.weeklyLog[scope] && state.weeklyLog[scope][k]) || 0;
  }
  return total;
}

function isTaskDone(task, kidId) {
  const tk = todayKey();
  if (task.shared) {
    return state.completedShared[tk] && state.completedShared[tk][task.id];
  }
  return state.completedPerso[kidId] && state.completedPerso[kidId][tk] && state.completedPerso[kidId][tk].includes(task.id);
}

function whoDidShared(taskId) {
  const tk = todayKey();
  return state.completedShared[tk] && state.completedShared[tk][taskId];
}

function fullDayName(date) {
  return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][date.getDay()];
}

function dayLetter(date) {
  return ['D','L','M','M','J','V','S'][date.getDay()];
}

// === RENDER HELPERS ===
function iconBlock(icon) {
  const color = ICON_COLOR[icon] || 'gray';
  return `<div class="card-icon icon-${color}">${ICONS[icon] || ICONS.gift}</div>`;
}

function html(strings, ...values) {
  return strings.reduce((acc, str, i) => {
    let v = values[i];
    if (v === undefined || v === null) v = '';
    return acc + str + v;
  }, '');
}

function renderTabContent() {
  switch (state.activeTab) {
    case 'tasks': return renderTodayTasks();
    case 'week': return renderWeek();
    case 'rewards': return renderRewards();
    case 'history': return renderHistory();
    case 'parent': return renderParent();
    default: return '';
  }
}

function render() {
  if (!state) {
    document.getElementById('root').innerHTML = '<div class="loader">Chargement…</div>';
    return;
  }
  document.getElementById('root').innerHTML = html`
    ${renderTopbar()}
    <div class="top-section">
      ${renderKidSelector()}
      ${renderFamilyBar()}
    </div>
    ${renderStats()}
    ${renderTabs()}
    <div id="tabContent">${renderTabContent()}</div>
  `;
}

// === ACTIONS ===
function applyDelta(kid, v, label) {
  // On empêche d'aller en dessous de 0 sur le solde
  const realDelta = v < 0 ? -Math.min(kid.points, -v) : v;
  kid.points += realDelta;
  if (realDelta > 0) kid.totalEarned += realDelta;
  const time = formatTime();
  state.history.push({ id: 'h'+Date.now(), kidId: kid.id, type: realDelta > 0 ? 'task' : 'reward', name: label, points: realDelta, date: 'Aujourd\'hui ' + time });
  if (realDelta > 0) {
    const dk = todayKey();
    state.weeklyLog[kid.id] = state.weeklyLog[kid.id] || {};
    state.weeklyLog[kid.id][dk] = (state.weeklyLog[kid.id][dk] || 0) + realDelta;
  }
}

function logFamilyHistory(v, label) {
  const time = formatTime();
  state.history.push({ id: 'hf'+Date.now(), kidId: 'family', type: v > 0 ? 'task' : 'reward', name: label, points: v, date: 'Aujourd\'hui ' + time });
  if (v > 0) {
    const dk = todayKey();
    state.weeklyLog.family = state.weeklyLog.family || {};
    state.weeklyLog.family[dk] = (state.weeklyLog.family[dk] || 0) + v;
  }
}

function formatTime() {
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

function toggleTask(taskId, isShared) {
  const k = activeKid();
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const dk = todayKey();
  const time = formatTime();

  if (isShared) {
    state.completedShared[dk] = state.completedShared[dk] || {};
    const currentDoer = state.completedShared[dk][taskId];

    if (currentDoer === k.id) {
      delete state.completedShared[dk][taskId];
      k.points -= task.points;
      k.totalEarned -= task.points;
      state.familyPoints -= task.points;
      state.familyTotalEarned -= task.points;
      state.weeklyLog[k.id] = state.weeklyLog[k.id] || {};
      state.weeklyLog[k.id][dk] = Math.max(0, (state.weeklyLog[k.id][dk] || 0) - task.points);
      state.weeklyLog.family = state.weeklyLog.family || {};
      state.weeklyLog.family[dk] = Math.max(0, (state.weeklyLog.family[dk] || 0) - task.points);
      // Retire 2 dernières entrées d'historique liées à cette tâche
      let removed = 0;
      for (let i = state.history.length - 1; i >= 0 && removed < 2; i--) {
        if (state.history[i].type === 'task' && state.history[i].name.replace(/^↳ /, '') === task.name) {
          state.history.splice(i, 1);
          removed++;
        }
      }
    } else if (!currentDoer) {
      state.completedShared[dk][taskId] = k.id;
      k.points += task.points;
      k.totalEarned += task.points;
      state.familyPoints += task.points;
      state.familyTotalEarned += task.points;
      state.weeklyLog[k.id] = state.weeklyLog[k.id] || {};
      state.weeklyLog[k.id][dk] = (state.weeklyLog[k.id][dk] || 0) + task.points;
      state.weeklyLog.family = state.weeklyLog.family || {};
      state.weeklyLog.family[dk] = (state.weeklyLog.family[dk] || 0) + task.points;
      state.history.push({ id: 'h'+Date.now(), kidId: k.id, type: 'task', name: task.name, points: task.points, date: 'Aujourd\'hui ' + time });
      state.history.push({ id: 'h'+Date.now()+1, kidId: 'family', type: 'task', name: '↳ ' + task.name, points: task.points, date: 'Aujourd\'hui ' + time });
    }
  } else {
    state.completedPerso[k.id] = state.completedPerso[k.id] || {};
    state.completedPerso[k.id][dk] = state.completedPerso[k.id][dk] || [];
    const arr = state.completedPerso[k.id][dk];
    const idx = arr.indexOf(taskId);
    state.weeklyLog[k.id] = state.weeklyLog[k.id] || {};
    state.weeklyLog.family = state.weeklyLog.family || {};

    if (idx >= 0) {
      arr.splice(idx, 1);
      k.points -= task.points;
      k.totalEarned -= task.points;
      state.familyPoints -= task.points;
      state.familyTotalEarned -= task.points;
      state.weeklyLog[k.id][dk] = Math.max(0, (state.weeklyLog[k.id][dk] || 0) - task.points);
      state.weeklyLog.family[dk] = Math.max(0, (state.weeklyLog.family[dk] || 0) - task.points);
      let removed = 0;
      for (let i = state.history.length - 1; i >= 0 && removed < 2; i--) {
        if (state.history[i].type === 'task' && state.history[i].name.replace(/^↳ /, '') === task.name) {
          state.history.splice(i, 1);
          removed++;
        }
      }
    } else {
      arr.push(taskId);
      k.points += task.points;
      k.totalEarned += task.points;
      state.familyPoints += task.points;
      state.familyTotalEarned += task.points;
      state.weeklyLog[k.id][dk] = (state.weeklyLog[k.id][dk] || 0) + task.points;
      state.weeklyLog.family[dk] = (state.weeklyLog.family[dk] || 0) + task.points;
      state.history.push({ id: 'h'+Date.now(), kidId: k.id, type: 'task', name: task.name, points: task.points, date: 'Aujourd\'hui ' + time });
      state.history.push({ id: 'h'+Date.now()+1, kidId: 'family', type: 'task', name: '↳ ' + task.name, points: task.points, date: 'Aujourd\'hui ' + time });
    }
  }
  debouncedSave();
  render();
}

function redeemReward(rewardId, rtype) {
  const k = activeKid();
  const list = rtype === 'famille' ? state.rewardsFamille : state.rewardsPerso;
  const reward = list.find(r => r.id === rewardId);
  if (!reward) return;
  const balance = rtype === 'famille' ? state.familyPoints : k.points;
  if (balance < reward.cost) return;

  const msg = rtype === 'famille'
    ? `Échanger ${reward.cost} ★ de la cagnotte famille contre "${reward.name}" ?\n\nN'oublie pas d'en parler à papa ou maman !`
    : `Échanger ${reward.cost} ★ de tes points persos contre "${reward.name}" ?\n\nN'oublie pas d'en parler à papa ou maman !`;
  if (!confirm(msg)) return;

  const time = formatTime();
  if (rtype === 'famille') {
    state.familyPoints -= reward.cost;
    state.history.push({ id: 'h'+Date.now(), kidId: 'family', type: 'reward', name: reward.name, points: -reward.cost, date: `Aujourd'hui ${time} (par ${k.name})` });
  } else {
    k.points -= reward.cost;
    state.history.push({ id: 'h'+Date.now(), kidId: k.id, type: 'reward', name: reward.name, points: -reward.cost, date: 'Aujourd\'hui ' + time });
  }
  debouncedSave();
  render();
}

// === EVENT DELEGATION ===
function handleClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch (action) {
    case 'kid':
      state.activeKidId = id;
      if (state.activeTab === 'parent') state.activeTab = 'tasks';
      state.parentUnlocked = false;
      debouncedSave();
      render();
      break;

    case 'tab':
      state.activeTab = id;
      if (id !== 'parent') state.parentUnlocked = false;
      render();
      break;

    case 'toggle-task':
      toggleTask(id, target.dataset.shared === 'true');
      break;

    case 'reward-view':
      state.rewardView = id;
      render();
      break;

    case 'redeem':
      redeemReward(id, target.dataset.rtype);
      break;

    case 'unlock': {
      const v = document.getElementById('pinInput').value;
      if (v === CONFIG.PARENT_PIN) {
        state.parentUnlocked = true;
        render();
      } else {
        document.getElementById('pinError').textContent = 'Code incorrect';
      }
      break;
    }

    case 'lock':
      state.parentUnlocked = false;
      render();
      break;

    case 'adjust': {
      const inp = document.getElementById('adj-' + id);
      const v = parseInt(inp.value);
      if (isNaN(v)) return;
      if (id === 'family') {
        state.familyPoints += v;
        if (v > 0) state.familyTotalEarned += v;
        logFamilyHistory(v, 'Ajustement parent');
      } else {
        const kid = state.kids.find(k => k.id === id);
        applyDelta(kid, v, 'Ajustement parent');
      }
      inp.value = '';
      debouncedSave();
      render();
      break;
    }

    case 'bonus': {
      const kid = state.kids.find(k => k.id === id);
      const amt = parseInt(target.dataset.amt);
      applyDelta(kid, amt, amt > 0 ? 'Bonus' : 'Pénalité');
      debouncedSave();
      render();
      break;
    }

    case 'apply-penalty': {
      const bonus = state.penalties.find(p => p.id === id);
      if (!bonus) break;
      const kid = activeKid();
      if (!confirm(`Donner le bonus "${bonus.name}" (+${bonus.cost} ★) à ${kid.name} ?`)) break;
      // On donne les points à l'enfant ET on alimente la cagnotte famille (comme une tâche normale)
      applyDelta(kid, bonus.cost, '🌟 ' + bonus.name);
      state.familyPoints += bonus.cost;
      state.familyTotalEarned += bonus.cost;
      const dk = todayKey();
      state.weeklyLog.family = state.weeklyLog.family || {};
      state.weeklyLog.family[dk] = (state.weeklyLog.family[dk] || 0) + bonus.cost;
      logFamilyHistory(bonus.cost, '↳ 🌟 ' + bonus.name);
      debouncedSave();
      render();
      break;
    }

    case 'save-penalty': {
      const name = document.getElementById('npName').value.trim();
      if (!name) return;
      const cost = parseInt(document.getElementById('npCost').value) || 5;
      const icon = document.getElementById('npIcon').value;
      state.penalties.push({ id: 'p'+Date.now(), name, cost, icon });
      debouncedSave();
      render();
      break;
    }

    case 'del-penalty':
      if (confirm('Supprimer cette pénalité ?')) {
        state.penalties = state.penalties.filter(p => p.id !== id);
        debouncedSave();
        render();
      }
      break;

    case 'toggle-form': {
      const f = document.getElementById(id);
      if (f) f.classList.toggle('open');
      break;
    }

    case 'save-task': {
      const name = document.getElementById('ntName').value.trim();
      if (!name) return;
      const points = parseInt(document.getElementById('ntPoints').value) || 3;
      const icon = document.getElementById('ntIcon').value;
      const cat = document.getElementById('ntCat').value;
      const freq = document.getElementById('ntFreq').value;
      const shared = document.getElementById('ntShared1').checked;
      state.tasks.push({ id: 't'+Date.now(), name, points, icon, frequency: freq, category: cat, shared });
      debouncedSave();
      render();
      break;
    }

    case 'save-rewardp': {
      const name = document.getElementById('nrpName').value.trim();
      if (!name) return;
      const cost = parseInt(document.getElementById('nrpCost').value) || 20;
      const icon = document.getElementById('nrpIcon').value;
      state.rewardsPerso.push({ id: 'rp'+Date.now(), name, cost, icon });
      debouncedSave();
      render();
      break;
    }

    case 'save-rewardf': {
      const name = document.getElementById('nrfName').value.trim();
      if (!name) return;
      const cost = parseInt(document.getElementById('nrfCost').value) || 80;
      const icon = document.getElementById('nrfIcon').value;
      state.rewardsFamille.push({ id: 'rf'+Date.now(), name, cost, icon });
      debouncedSave();
      render();
      break;
    }

    case 'del-task':
      if (confirm('Supprimer cette tâche ?')) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        debouncedSave();
        render();
      }
      break;

    case 'del-rewardp':
      if (confirm('Supprimer cette récompense ?')) {
        state.rewardsPerso = state.rewardsPerso.filter(r => r.id !== id);
        debouncedSave();
        render();
      }
      break;

    case 'del-rewardf':
      if (confirm('Supprimer cette récompense ?')) {
        state.rewardsFamille = state.rewardsFamille.filter(r => r.id !== id);
        debouncedSave();
        render();
      }
      break;

    case 'reset-week':
      if (confirm('Réinitialiser la semaine en cours ?')) {
        const ws = weekStart(new Date());
        for (let i = 0; i < 7; i++) {
          const d = new Date(ws);
          d.setDate(d.getDate() + i);
          const dk = d.toISOString().slice(0, 10);
          state.kids.forEach(k => {
            if (state.weeklyLog[k.id]) delete state.weeklyLog[k.id][dk];
            if (state.completedPerso[k.id]) delete state.completedPerso[k.id][dk];
          });
          if (state.weeklyLog.family) delete state.weeklyLog.family[dk];
          delete state.completedShared[dk];
        }
        debouncedSave();
        render();
      }
      break;

    case 'reset-all':
      if (confirm('Tout effacer (points, historique, retour aux paramètres par défaut) ?')) {
        const binId = getBinId();
        state = clone(DEFAULT_STATE);
        state.parentUnlocked = true;
        state.activeTab = 'parent';
        if (binId) state.binId = binId;
        debouncedSave();
        render();
      }
      break;

    case 'copy-link': {
      const link = document.getElementById('shareLink').value;
      navigator.clipboard.writeText(link).then(() => {
        target.textContent = 'Copié !';
        setTimeout(() => { target.textContent = 'Copier le lien'; }, 2000);
      });
      break;
    }
  }
}

// Enter key on PIN
function handleKeydown(e) {
  if (e.target.id === 'pinInput' && e.key === 'Enter') {
    document.querySelector('[data-action="unlock"]').click();
  }
}

// === INIT ===
async function init() {
  document.addEventListener('click', handleClick);
  document.addEventListener('keydown', handleKeydown);
  await loadState();
  render();
  if (CONFIG.USE_CLOUD && getBinId()) {
    pollTimer = setInterval(pollUpdates, CONFIG.POLL_INTERVAL);
  }
}

init();
