<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D21" media="(prefers-color-scheme: dark)">
<title>Mes tâches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* PALETTE — adaptive light/dark, sobre */
:root {
  color-scheme: light;
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-2: #F4F4F0;
  --ink: #1A1A1A;
  --ink-muted: #5A5A5A;
  --ink-hint: #9A9A98;
  --border: rgba(0,0,0,0.06);
  --border-md: rgba(0,0,0,0.12);
  --border-lg: rgba(0,0,0,0.22);
  --accent: #3B4A5A;
  --accent-soft: rgba(59,74,90,0.08);
  --accent-mid: rgba(59,74,90,0.20);
  --danger: #A83535;
  --success: #3A6B4C;
  --radius: 10px;
  --radius-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #1A1D21;
    --surface: #242830;
    --surface-2: #2C3038;
    --ink: #E4E4E7;
    --ink-muted: #A0A4AB;
    --ink-hint: #6B7078;
    --border: rgba(255,255,255,0.06);
    --border-md: rgba(255,255,255,0.12);
    --border-lg: rgba(255,255,255,0.22);
    --accent: #7B8FA3;
    --accent-soft: rgba(123,143,163,0.14);
    --accent-mid: rgba(123,143,163,0.30);
    --danger: #C97B7B;
    --success: #7BAF8E;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; overflow: hidden; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  position: relative;
  font-size: 14px;
  line-height: 1.5;
}
h1, h2, h3, .app-title, .tab-btn, .drawer-title, .section-lbl, .loading-title { font-family: 'Montserrat', sans-serif; }

/* HEADER */
.app-header {
  padding: 1rem 1.25rem 0.5rem;
  padding-top: calc(1rem + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.app-title em { color: var(--accent); font-style: normal; }

/* TABS */
.tabs-wrap {
  position: relative;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.tabs-arrow {
  position: absolute;
  top: 0;
  bottom: 1px;
  width: 32px;
  border: none;
  background: var(--bg);
  color: var(--ink-muted);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  z-index: 2;
  display: none;
  align-items: center;
  justify-content: center;
  transition: color 0.12s;
  font-family: inherit;
}
.tabs-arrow:hover { color: var(--ink); }
.tabs-arrow-l { left: 0; box-shadow: 4px 0 8px -2px var(--bg); }
.tabs-arrow-r { right: 0; box-shadow: -4px 0 8px -2px var(--bg); }
.tabs-arrow.visible { display: flex; }
@media (hover: none) { .tabs-arrow { display: none !important; } }

.tabs-bar {
  display: flex;
  gap: 4px;
  padding: 0.25rem 1rem 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
  background: transparent;
  border: none;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.12s, border-color 0.12s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.tab-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tab-count {
  font-size: 11px;
  color: var(--ink-hint);
  font-weight: 500;
  min-width: 16px;
  text-align: center;
}
.tab-btn.active .tab-count { color: var(--accent); }
.tab-add {
  color: var(--ink-hint);
  font-size: 16px;
  padding: 6px 12px;
  border: 1px dashed var(--border-md);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  align-self: center;
  margin: 0 4px 4px 4px;
}
.tab-add:hover { color: var(--ink); border-color: var(--border-lg); }

/* CONTENT */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.25rem 1.5rem;
  min-height: 0;
  scrollbar-width: thin;
}

/* TASK ITEMS */
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.task-item:last-child { border-bottom: none; }
.task-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border-lg);
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  transition: all 0.12s;
}
.task-check:hover { border-color: var(--accent); }
.task-check.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
  font-size: 11px;
}
.task-body { flex: 1; min-width: 0; }
.task-text {
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  color: var(--ink);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.task-text.done {
  text-decoration: line-through;
  color: var(--ink-hint);
}
.task-cat-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
}
.task-del {
  border: none;
  background: transparent;
  color: var(--ink-hint);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.12s, color 0.12s;
  align-self: center;
}
.task-del:hover { color: var(--danger); }
.task-item:hover .task-del { opacity: 1; }
@media (hover: none) { .task-del { opacity: 1; } }

/* Empty */
.empty { text-align: center; padding: 3rem 1rem; color: var(--ink-hint); font-size: 13px; }
.empty-icon { font-size: 28px; margin-bottom: 0.5rem; opacity: 0.5; }

/* Section label */
.section-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin: 1.5rem 0 0.6rem;
}
.section-lbl:first-child { margin-top: 0; }

/* Done section */
.done-section { margin-top: 1.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.done-hdr {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: transparent;
  border: none;
  padding: 10px 0;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.done-hdr:hover { color: var(--ink); }
.done-caret { font-size: 9px; opacity: 0.5; }
.done-body .task-item { opacity: 0.6; }
.done-body .task-item:hover { opacity: 1; }

/* Room sections (Travaux) */
.room-section { margin-bottom: 0.5rem; }
.room-hdr {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 10px 0 8px;
  margin-bottom: 0.25rem;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  text-align: left;
}
.room-hdr:hover { color: var(--accent); }
.room-caret {
  font-size: 9px;
  color: var(--ink-hint);
  width: 10px;
  flex-shrink: 0;
}
.room-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-hint);
  background: var(--surface-2);
  padding: 2px 8px;
  border-radius: 10px;
}
.room-body .task-item:last-child { border-bottom: 1px solid var(--border); }

/* Input bar */
.input-bar {
  padding: 0.75rem 1rem;
  padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}
.quick-input {
  flex: 1;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  border: 1px solid var(--border-md);
  border-radius: 22px;
  background: var(--surface-2);
  color: var(--ink);
  outline: none;
  transition: border-color 0.12s;
}
.quick-input:focus { border-color: var(--accent); }
.quick-input::placeholder { color: var(--ink-hint); }
.add-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  color: var(--surface);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.1s;
}
.add-btn:active { transform: scale(0.94); }

/* Overlays / drawers */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }
.drawer {
  background: var(--surface);
  color: var(--ink);
  border-radius: 18px 18px 0 0;
  padding: 1.25rem 1.25rem 2rem;
  padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.22s cubic-bezier(.32,0,.15,1);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.10);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.drawer-handle { width: 32px; height: 4px; background: var(--border-md); border-radius: 2px; margin: 0 auto 1rem; }
.drawer-title { font-size: 17px; font-weight: 700; margin-bottom: 1rem; color: var(--ink); }
.field { margin-bottom: 14px; }
.field-lbl {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
input[type=text], input[type=date] {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 12px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--ink);
  outline: none;
  transition: border-color 0.12s;
}
input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--surface);
  cursor: pointer;
  margin-top: 4px;
}
.btn-ghost {
  width: 100%;
  padding: 10px;
  font-family: inherit;
  font-size: 13px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  margin-top: 8px;
}
.btn-danger {
  width: 100%;
  padding: 10px;
  font-family: inherit;
  font-size: 13px;
  border: 1px solid var(--danger);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--danger);
  cursor: pointer;
  margin-top: 8px;
}
.btn-archive {
  width: 100%;
  padding: 10px;
  font-family: inherit;
  font-size: 13px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
  margin-top: 8px;
  font-weight: 500;
}
.btn-archive:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Archive drawer list */
.archive-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}
.archive-item:last-of-type { border-bottom: none; }
.archive-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.archive-info { flex: 1; min-width: 0; }
.archive-name { font-size: 13px; font-weight: 600; }
.archive-meta { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.archive-restore {
  background: var(--accent-soft);
  color: var(--accent);
  border: none;
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.archive-restore:hover { background: var(--accent); color: var(--surface); }
.archive-empty { text-align: center; padding: 2rem 1rem; color: var(--ink-hint); font-size: 13px; }

/* Tab-add and archive button in tabs bar */
.tab-arch {
  color: var(--ink-hint);
  font-size: 14px;
  padding: 6px 10px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  align-self: center;
  margin: 0 2px 4px 2px;
  transition: color 0.12s, border-color 0.12s;
}
.tab-arch:hover { color: var(--ink); border-color: var(--border-md); }
.tab-arch.hidden { display: none; }

/* Color grid */
.color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 4px; }
.color-swatch {
  aspect-ratio: 1;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.12s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: var(--ink); }

/* Habits */
.habits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.habit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem 0.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
}
.habit-card:hover { border-color: var(--accent-mid); }
.habit-card.done { background: var(--accent-soft); border-color: var(--accent); }
.habit-card.skipped { background: rgba(168,53,53,0.06); border-color: var(--danger); opacity: 0.7; }
.hc-emoji { font-size: 22px; line-height: 1; margin-bottom: 4px; }
.hc-name { font-size: 10px; font-weight: 600; color: var(--ink-muted); line-height: 1.2; height: 24px; display: flex; align-items: center; justify-content: center; }
.hc-streak { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 800; color: var(--ink); margin-top: 2px; }
.hc-streak-lbl { font-size: 9px; color: var(--ink-hint); }
.habit-card.done .hc-streak, .habit-card.done .hc-name { color: var(--accent); }
.hc-mark { position: absolute; top: 5px; right: 6px; font-size: 11px; opacity: 0; }
.habit-card.done .hc-mark { opacity: 1; color: var(--accent); }
.habit-card.skipped .hc-mark { opacity: 1; color: var(--danger); }

.hab-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 10px; }
.hab-detail-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
.hab-detail-emoji { font-size: 20px; }
.hab-detail-name { font-size: 13px; font-weight: 600; flex: 1; }
.hab-detail-stats { font-size: 11px; color: var(--ink-muted); }
.hm-day {
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  cursor: pointer;
}
.hm-day.ok { background: var(--accent-soft); border-color: var(--accent); }
.hm-day.ko { background: rgba(168,53,53,0.08); border-color: var(--danger); }
.hm-day.today { box-shadow: 0 0 0 1.5px var(--ink); }

/* Books */
.book-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 1rem; padding-bottom: 2px; }
.book-filters::-webkit-scrollbar { display: none; }
.book-filter {
  padding: 5px 11px;
  font-size: 11px;
  font-family: inherit;
  border: 1px solid var(--border-md);
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink-muted);
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  font-weight: 500;
}
.book-filter.active { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.book-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.book-spine { width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch; }
.book-info { flex: 1; min-width: 0; }
.book-title { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.book-author { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.book-footer { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11px; }
.book-stars { color: var(--accent); }
.book-date { color: var(--ink-hint); }
.book-del { border: none; background: transparent; color: var(--ink-hint); cursor: pointer; font-size: 13px; padding: 0; align-self: flex-start; }
.star-row { display: flex; gap: 8px; font-size: 24px; cursor: pointer; margin-top: 4px; }
.star-row span { opacity: 0.25; transition: opacity 0.1s; color: var(--accent); }
.star-row span.on { opacity: 1; }

/* Life */
.life-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
.life-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.life-num { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; color: var(--ink); }
.life-lbl { font-size: 10px; color: var(--ink-muted); margin-top: 2px; }
.life-grid-wrap { overflow-x: auto; padding-bottom: 6px; margin-bottom: 0.75rem; }
.lw { width: 5px; height: 5px; border-radius: 1px; }
.lw.past { background: var(--border-md); }
.lw.cur { background: var(--accent); }
.lw.fut { background: var(--surface); border: 1px solid var(--border); }
.lw.ms { background: var(--danger) !important; }
.life-legend { display: flex; gap: 12px; font-size: 11px; color: var(--ink-muted); margin-bottom: 1.5rem; flex-wrap: wrap; }
.life-li { display: flex; align-items: center; gap: 4px; }
.life-dot { width: 9px; height: 9px; border-radius: 1px; }
.ms-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.ms-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
.ms-info { flex: 1; }
.ms-label { font-size: 13px; font-weight: 500; }
.ms-date { font-size: 11px; color: var(--ink-muted); margin-top: 1px; }

/* Loading */
.loading {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--bg);
  z-index: 500;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
}
.loading-title { font-size: 22px; font-weight: 700; }
.loading-title em { color: var(--accent); font-style: normal; }
.loading-msg { font-size: 12px; color: var(--ink-muted); }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-title">mes <em>tâches</em></div>
  <div class="loading-msg">Chargement…</div>
</div>

<div class="app-header">
  <div class="app-title">mes <em>tâches</em></div>
</div>

<div class="tabs-wrap">
  <button class="tabs-arrow tabs-arrow-l" id="tabs-arrow-l" onclick="scrollTabs(-1)" aria-label="Défiler à gauche">‹</button>

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

function markViewUsed(viewId) {
  VIEW_LAST_USED[viewId] = Date.now();

// Dernière activité d'une catégorie = max(created_at, done_at parsé) sur ses tâches
function catLastActivity(catKey) {
  var maxT = 0;
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    if (t.cat !== catKey) continue;
    if (t.created_at && t.created_at > maxT) maxT = t.created_at;
    if (t.done_at) {
      // done_at est une string ISO "YYYY-MM-DD" — on la convertit en timestamp
      var d = Date.parse(t.done_at + 'T12:00:00');
      if (!isNaN(d) && d > maxT) maxT = d;
    }
  }
  return maxT;
}

function getTabList() {
  var list = [{ id: 'all', label: 'Toutes', type: 'all', rank: Infinity }]; // toujours en premier
  Object.keys(CATS).forEach(function(k) {
    list.push({
      id: 'cat:' + k,
      label: CATS[k].label,
      color: CATS[k].color,
      catKey: k,
      type: 'category',
      rank: catLastActivity(k)
    });
  });
  list.push({ id: 'habits', label: 'Habitudes', type: 'view', icon: '✓', rank: VIEW_LAST_USED['habits'] || 0 });
  list.push({ id: 'books',  label: 'Livres',    type: 'view', icon: '📚', rank: VIEW_LAST_USED['books']  || 0 });
  list.push({ id: 'life',   label: 'Ma vie',    type: 'view', icon: '⌛', rank: VIEW_LAST_USED['life']   || 0 });
  // Tri : "Toutes" (Infinity) toujours en premier, puis le reste par rank décroissant.
  // Pour les items sans activité (rank=0), on tombe sur un ordre alphabétique stable.
  list.sort(function(a, b) {
    if (a.rank !== b.rank) return b.rank - a.rank;
    return (a.label || '').localeCompare(b.label || '');
  });
  return list;
}

/* Scroll horizontal des onglets (desktop) */
function scrollTabs(dir) {
  var bar = document.getElementById('tabs-bar');
  bar.scrollBy({ left: dir * 200, behavior: 'smooth' });
}
function updateTabsArrows() {
  var bar = document.getElementById('tabs-bar');
  var l = document.getElementById('tabs-arrow-l');
  var r = document.getElementById('tabs-arrow-r');
  if (!bar || !l || !r) return;
  var overflow = bar.scrollWidth > bar.clientWidth + 2;
  if (!overflow) { l.classList.remove('visible'); r.classList.remove('visible'); return; }
  l.classList.toggle('visible', bar.scrollLeft > 4);
  r.classList.toggle('visible', bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 4);
}
/* Convertit le scroll vertical en horizontal quand on est sur la barre d'onglets (souris à molette) */
document.addEventListener('DOMContentLoaded', function() {
  var bar = document.getElementById('tabs-bar');
  if (!bar) return;
  bar.addEventListener('wheel', function(e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      bar.scrollLeft += e.deltaY;
    }
  }, { passive: false });
  bar.addEventListener('scroll', updateTabsArrows);
  window.addEventListener('resize', updateTabsArrows);
});

function renderTaskList(active, done, catKey) {

      + '</div>';
  }
  return html;
}

function isTaskVisible(t) {
  // Cacher les tâches dont la catégorie n'existe plus dans CATS actives
  return CATS[t.cat] !== undefined;
}

function renderAllTasks() {
  var active = tasks.filter(function(t) { return !t.done && isTaskVisible(t); }).sort(sortTasks);
  var done   = tasks.filter(function(t) { return t.done && isTaskVisible(t); }).sort(sortDone);
  return renderTaskList(active, done, null);
}

function renderCatTasks(catKey) {
  var active = tasks.filter(function(t) { return !t.done && t.cat === catKey; }).sort(sortTasks);
  var done   = tasks.filter(function(t) { return t.done && t.cat === catKey; }).sort(sortDone);
  // Cas spécial: Travaux → sections par pièce (préfixe "Pièce — ...")
  if (catKey === 'tr') {
    return renderRoomGrouped(active, done, catKey);
  }
  return renderTaskList(active, done, catKey);
}

/* Parse "Pièce — description" ; renvoie {room, text} */
function parseRoom(text) {
  // Séparateur : em-dash (—), en-dash (–) ou hyphen-minus (-) précédé d'espaces
  var m = text.match(/^([^—–\-]+?)\s*[—–\-]\s+(.+)$/);
  if (m) return { room: m[1].trim(), text: m[2].trim() };
  return { room: 'Sans pièce', text: text };
}

/* Ordre logique des pièces (les autres viennent après par ordre alpha) */
var ROOM_ORDER = [
  'Général', 'Sous-sol', 'Bureau',
  'Salon bas', 'Cuisine', 'Couloir', 'Salon haut',
  'Chambre Chloé', 'Chambre Millie', 'Chambre Léo', 'Chambre parents',
  'Salle de bain', 'Balcon (grand)', 'Balcon', 'Jardin',
  'Sans pièce'
];

function roomRank(r) {
  var i = ROOM_ORDER.indexOf(r);
  return i === -1 ? 999 : i;
}

function renderRoomGrouped(active, done, catKey) {
  var html = '';
  if (active.length === 0 && done.length === 0) {
    return '<div class="empty"><div class="empty-icon">🔨</div>Aucune tâche ici.<br>Tape ta première ci-dessous.</div>';
  }
  // Grouper les actives par pièce
  var groups = {};
  active.forEach(function(t) {
    var p = parseRoom(t.text);
    if (!groups[p.room]) groups[p.room] = [];
    groups[p.room].push({ task: t, cleanText: p.text });
  });
  var roomKeys = Object.keys(groups).sort(function(a, b) {
    var ra = roomRank(a), rb = roomRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });
  if (roomKeys.length === 0) {
    html += '<div class="empty" style="padding:1.5rem 1rem">Tout est fait ici 🎉</div>';
  } else {
    roomKeys.forEach(function(room) {
      var items = groups[room];
      var key = 'tr_room_' + room;
      // Par défaut ouvert. On stocke l'état PLIÉ dans doneOpenByCat (réutilise le même mécanisme, valeur inversée)
      var isCollapsed = doneOpenByCat[key] === 'collapsed';
      html += '<div class="room-section">'
        + '<button class="room-hdr" onclick="toggleRoomSection(\'' + escAttr(key) + '\')">'
        +   '<span class="room-caret">' + (isCollapsed ? '▶' : '▼') + '</span>'
        +   '<span>' + esc(room) + '</span>'
        +   '<span class="room-count">' + items.length + '</span>'
        + '</button>';
      if (!isCollapsed) {
        html += '<div class="room-body">' + items.map(function(item) {
          return roomTaskHTML(item.task, item.cleanText);
        }).join('') + '</div>';
      }
      html += '</div>';
    });
  }
  // Terminées globales pour Travaux (pas regroupées, comme les autres catégories)
  if (done.length > 0) {
    var doneKey = catKey;
    var isOpen = !!doneOpenByCat[doneKey];
    html += '<div class="done-section">'
      + '<button class="done-hdr" onclick="toggleDoneSection(\'' + doneKey + '\')">'
      +   '<span>✓ Terminées (' + done.length + ')</span>'
      +   '<span class="done-caret">' + (isOpen ? '▼' : '▶') + '</span>'
      + '</button>'
      + (isOpen ? '<div class="done-body">' + done.map(function(t) {
          var p = parseRoom(t.text);
          return roomTaskHTML(t, p.room + ' — ' + p.text);
        }).join('') + '</div>' : '')
      + '</div>';
  }
  return html;
}

function roomTaskHTML(t, displayText) {
  var cat = CATS[t.cat] || { label: 'Autres', color: '#8A8A8A' };
  return '<div class="task-item">'
    + '<div class="task-check' + (t.done ? ' checked' : '') + '" onclick="toggleDone(\'' + t.id + '\')">' + (t.done ? '✓' : '') + '</div>'

/* ARCHIVER : la catégorie et ses tâches disparaissent des vues, mais restent en base */
function archiveCat() {
  if (!editCatId || editCatId === 'au') return;
  var cat = CATS[editCatId];
  if (!cat) return;
  var taskCount = tasks.filter(function(t) { return t.cat === editCatId; }).length;
  var msg = 'Archiver "' + cat.label + '" ?';
  if (taskCount > 0) msg += '\n\n' + taskCount + ' tâche' + (taskCount > 1 ? 's seront masquées' : ' sera masquée') + ' (elles reviendront à la restauration).';
  if (!confirm(msg)) return;
  ARCHIVED_CATS[editCatId] = {
    label: cat.label,
    color: cat.color,
    archived_at: Date.now()
  };
  saveArchivedCats();
  delete CATS[editCatId];
  saveCats();
  if (currentTab === 'cat:' + editCatId) currentTab = 'all';
  closeOverlay(null, 'cat-overlay');
  renderTabs();

}

function openArchiveDrawer() {
  var list = document.getElementById('archive-list');

  if (keys.length === 0) {
    list.innerHTML = '<div class="archive-empty">Aucune catégorie archivée.</div>';
  } else {
    // Trier par date d'archivage descendante
    keys.sort(function(a, b) { return (ARCHIVED_CATS[b].archived_at || 0) - (ARCHIVED_CATS[a].archived_at || 0); });
    list.innerHTML = keys.map(function(id) {
      var a = ARCHIVED_CATS[id];

        +   '<div class="archive-name">' + esc(a.label) + '</div>'

        + '</div>'

}

function restoreCat(id) {
  var a = ARCHIVED_CATS[id];
  if (!a) return;
  // Si le même id existe déjà dans CATS (collision improbable mais possible), on refuse.
  if (CATS[id]) { alert('Une catégorie avec ce nom existe déjà.'); return; }
  CATS[id] = { label: a.label, color: a.color };
  delete ARCHIVED_CATS[id];
  saveCats();
  saveArchivedCats();
  closeOverlay(null, 'archive-overlay');
  renderTabs();
  renderContent();
}

function rgbToHex(rgb) {
  if (!rgb) return '#8A8A8A';
  if (rgb.charAt(0) === '#') return rgb;
  var m = rgb.match(/\d+/g);
  if (!m || m.length < 3) return '#8A8A8A';
  return '#' + [m[0], m[1], m[2]].map(function(x) {
    var h = parseInt(x, 10).toString(16);
    return h.length === 1 ? '0' + h : h;
  }).join('');
}

/* ============================================
   HABITS
   ============================================ */
function streakOf(habitId) {
  var data = hdata[habitId] || {};
  var d = new Date(); d.setHours(0, 0, 0, 0);
  var streak = 0;
  var todayKey = d.toLocaleDateString('fr-FR');
  if (data[todayKey] !== true) d.setDate(d.getDate() - 1);
  for (var i = 0; i < 400; i++) {
    var k = d.toLocaleDateString('fr-FR');
    if (data[k] === true) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

function renderHabits() {
  var fr = todayFR();
  var doneCount = HABITS.filter(function(h) { return hdata[h.id] && hdata[h.id][fr] === true; }).length;
  var html = '<div class="section-lbl">Aujourd\'hui — ' + doneCount + ' / ' + HABITS.length + '</div>';
  html += '<div class="habits-grid">';
  html += HABITS.map(function(h) {
    var v = hdata[h.id] && hdata[h.id][fr];
    var cls = 'habit-card' + (v === true ? ' done' : v === false ? ' skipped' : '');
    var s = streakOf(h.id);
    return '<div class="' + cls + '" onclick="cycleHabit(\'' + h.id + '\')" title="Clic: ✓ → ✗ → effacer">'
      + '<div class="hc-mark">' + (v === true ? '✓' : v === false ? '✗' : '') + '</div>'
      + '<div class="hc-emoji">' + h.emoji + '</div>'
      + '<div class="hc-name">' + esc(h.name) + '</div>'
      + '<div class="hc-streak">' + s + '</div>'
      + '<div class="hc-streak-lbl">' + (s > 1 ? 'jours' : 'jour') + '</div>'
      + '</div>';
  }).join('');
  html += '</div>';
  html += '<div class="section-lbl">Historique 90 jours</div>';
  html += HABITS.map(function(h) { return heatmapHTML(h); }).join('');
  return html;
}

function heatmapHTML(habit) {
  var data = hdata[habit.id] || {};
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var start = new Date(today); start.setDate(start.getDate() - 89);
  var days = [];
  var last30 = 0;
  for (var i = 0; i < 90; i++) {
    var d = new Date(start); d.setDate(d.getDate() + i);
    var key = d.toLocaleDateString('fr-FR');
    var v = data[key];
    if (i >= 60 && v === true) last30++;
    var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var cls = 'hm-day';
    if (v === true) cls += ' ok';
    else if (v === false) cls += ' ko';
    if (d.getTime() === today.getTime()) cls += ' today';
    days.push('<div class="' + cls + '" onclick="openHlog(\'' + habit.id + '\',\'' + iso + '\')" title="' + key + '"></div>');
  }
  return '<div class="hab-detail">'
    + '<div class="hab-detail-hdr">'
    +   '<span class="hab-detail-emoji">' + habit.emoji + '</span>'
    +   '<span class="hab-detail-name">' + esc(habit.name) + '</span>'
    +   '<span class="hab-detail-stats">' + last30 + '/30 j</span>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(15,1fr);gap:3px">' + days.join('') + '</div>'
    + '</div>';
}

async function cycleHabit(id) {
  var fr = todayFR();
  if (!hdata[id]) hdata[id] = {};
  var cur = hdata[id][fr];
  var next;
  if (cur === undefined || cur === null) next = true;
  else if (cur === true) next = false;
  else next = undefined;
  if (next === undefined) delete hdata[id][fr];
  else hdata[id][fr] = next;
  renderContent();
  await sbUpsert('habits', { id: id, data: hdata[id] });
}

function openHlog(id, ds) {
  hlogState = { id: id, ds: ds };
  var h = HABITS.find(function(x) { return x.id === id; });
  document.getElementById('hlog-title').textContent = h ? h.emoji + ' ' + h.name : '';

  document.getElementById('hlog-overlay').classList.add('open');
}
async function hlogSet(val) {
  if (!hlogState.id) return;
  var id = hlogState.id;
  var d = new Date(hlogState.ds + 'T00:00:00');
  var key = d.toLocaleDateString('fr-FR');
  if (!hdata[id]) hdata[id] = {};

/* ============================================
   LIFE
   ============================================ */
var BIRTH = '1988-05-14';
var LIFE_YEARS = 85;

function renderLife() {
  var birth = new Date(BIRTH + 'T00:00:00');
  var now = new Date();
  var msPerWeek = 7 * 24 * 3600 * 1000;
  var weeksLived = Math.floor((now - birth) / msPerWeek);
  var totalWeeks = LIFE_YEARS * 52;
  var pct = Math.round((weeksLived / totalWeeks) * 100);
  var yearsLived = Math.floor(weeksLived / 52);

  var msWeeks = {};
  milestones.forEach(function(m) {
    var d = new Date(m.date + 'T00:00:00');
    var w = Math.floor((d - birth) / msPerWeek);
    if (w >= 0 && w < totalWeeks) msWeeks[w] = m;
  });

  var html = '<div class="life-stats">'
    + '<div class="life-stat"><div class="life-num">' + yearsLived + '</div><div class="life-lbl">ans</div></div>'
    + '<div class="life-stat"><div class="life-num">' + weeksLived + '</div><div class="life-lbl">semaines</div></div>'
    + '<div class="life-stat"><div class="life-num">' + pct + '%</div><div class="life-lbl">de la vie</div></div>'
    + '</div>';

  html += '<div class="life-grid-wrap"><div style="display:grid;grid-template-columns:repeat(52,5px);gap:2px;padding:2px;">';
  for (var w = 0; w < totalWeeks; w++) {
    var cls = 'lw ';
    if (msWeeks[w]) cls += 'ms';
    else if (w < weeksLived) cls += 'past';
    else if (w === weeksLived) cls += 'cur';
    else cls += 'fut';
    var title = msWeeks[w] ? msWeeks[w].label + ' (' + msWeeks[w].date + ')' : '';
    html += '<div class="' + cls + '" title="' + esc(title) + '"></div>';
  }
  html += '</div></div>';

  html += '<div class="life-legend">'
    + '<div class="life-li"><div class="life-dot" style="background:var(--border-md)"></div>Passé</div>'
    + '<div class="life-li"><div class="life-dot" style="background:var(--accent)"></div>Cette semaine</div>'
    + '<div class="life-li"><div class="life-dot" style="background:var(--surface);border:1px solid var(--border)"></div>Futur</div>'
    + '<div class="life-li"><div class="life-dot" style="background:var(--danger)"></div>Moment marquant</div>'
    + '</div>';

  html += '<div class="section-lbl" style="display:flex;justify-content:space-between;align-items:center">'
    + '<span>Moments</span>'
    + '<button style="border:none;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer" onclick="openMsDrawer()">+ Ajouter</button>'
    + '</div>';
  var sorted = milestones.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
  if (sorted.length === 0) {
    html += '<div class="empty" style="padding:1rem">Aucun moment enregistré</div>';
  } else {
    html += sorted.map(function(m) {
      return '<div class="ms-item">'
        + '<div class="ms-dot"></div>'
        + '<div class="ms-info">'
        +   '<div class="ms-label">' + esc(m.label) + '</div>'
        +   '<div class="ms-date">' + new Date(m.date + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + '</div>'
        + '</div>'
        + '<button class="book-del" onclick="delMs(\'' + m.id + '\')">✕</button>'
        + '</div>';
    }).join('');
  }
  return html;
}

    }
    renderTabs();
    renderContent();
  } catch (e) {}
}, 30000);

setTimeout(function() {
  var l = document.getElementById('loading');
  if (l) l.style.display = 'none';
}, 4000);
</script>
</body>
